<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MasterBoard Tablet Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></script>
    
    <style>
        :root { --p: #3d5afe; --bg: #0f0f0f; }
        * { -webkit-tap-highlight-color: transparent; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }

        /* Background stays OUTSIDE the canvas */
        #board-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        .grid { background-image: radial-gradient(#333 1px, transparent 1px); background-size: 45px 45px; }
        .white { background: #ffffff; }

        /* Canvas is a 100% transparent sheet of glass */
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; background: transparent !important; }

        #toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 20px; display: flex; gap: 15px; 
            align-items: center; z-index: 100; border: 1px solid rgba(255,255,255,0.1);
        }

        .btn {
            background: #222; border: none; color: white; width: 50px; height: 50px;
            border-radius: 12px; cursor: pointer; font-size: 18px;
        }
        .active { background: var(--p) !important; box-shadow: 0 0 15px var(--p); }
    </style>
</head>
<body class="grid">

<div id="board-bg" class="grid"></div>

<div id="toolbar">
    <button class="btn active" id="penBtn" onclick="setTool('pen')"><i class="fas fa-pen"></i></button>
    <button class="btn" id="eraserBtn" onclick="setTool('eraser')"><i class="fas fa-eraser"></i></button>
    <input type="color" id="colorPicker" value="#ffffff" onchange="updateColor()">
    
    <div style="width:1px; height:30px; background:#444;"></div>
    
    <button class="btn" onclick="clearScreen()"><i class="fas fa-trash"></i></button>
    <select onchange="document.getElementById('board-bg').className = this.value" style="background:#222; color:white; border:none; padding:10px; border-radius:8px;">
        <option value="grid">Grid</option>
        <option value="white">White</option>
    </select>
</div>

<canvas id="sheet"></canvas>

<script>
    // CRITICAL: We must initialize the canvas with NO background color
    const canvas = new fabric.Canvas('sheet', {
        width: window.innerWidth,
        height: window.innerHeight,
        isDrawingMode: true,
        backgroundColor: 'rgba(0,0,0,0)', // Pure transparency
        enableRetinaScaling: true
    });

    function setTool(tool) {
        canvas.isDrawingMode = true;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));

        if (tool === 'pen') {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 4;
            canvas.freeDrawingBrush.color = document.getElementById('colorPicker').value;
            // "source-over" means "draw on top"
            canvas.freeDrawingBrush.globalCompositeOperation = 'source-over';
            document.getElementById('penBtn').classList.add('active');
        } 
        else if (tool === 'eraser') {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 50;
            // "destination-out" means "remove existing pixels"
            canvas.freeDrawingBrush.globalCompositeOperation = 'destination-out';
            document.getElementById('eraserBtn').classList.add('active');
        }
    }

    function updateColor() {
        if (canvas.freeDrawingBrush.globalCompositeOperation !== 'destination-out') {
            canvas.freeDrawingBrush.color = document.getElementById('colorPicker').value;
        }
    }

    function clearScreen() {
        if(confirm("Clear board?")) canvas.clear();
    }

    // Handle tablet orientation changes
    window.addEventListener('resize', () => {
        canvas.setDimensions({ width: window.innerWidth, height: window.innerHeight });
    });

    setTool('pen');
</script>

</body>
</html>

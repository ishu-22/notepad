<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master-Board Pro</title>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- FontAwesome for Icons (Fixes the square box issue) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #3d5afe; --dark: #121212; --panel: #252525; --text: #ffffff; }
        body { margin: 0; background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; }

        /* Navigation Bar (Top) */
        #top-bar {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: var(--panel); padding: 5px 20px; border-radius: 30px;
            display: flex; gap: 20px; align-items: center; z-index: 1000; border: 1px solid #444;
        }

        /* Floating Toolbar (Bottom) */
        #toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--panel); padding: 10px; border-radius: 20px;
            display: flex; gap: 10px; align-items: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 1000; border: 1px solid #444;
        }

        .btn {
            background: #333; border: none; color: white; padding: 12px;
            border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px;
            display: flex; align-items: center; justify-content: center; width: 45px; height: 45px;
        }
        .btn:hover { background: #444; }
        .active { background: var(--primary) !important; }

        /* Background Classes */
        .bg-dark { background-color: #121212; background-image: none; }
        .bg-white { background-color: #ffffff; background-image: none; }
        .bg-grid { background-image: radial-gradient(#333 1px, transparent 1px); background-size: 40px 40px; }
        .bg-ruled { background-image: linear-gradient(#333 1px, transparent 1px); background-size: 100% 35px; }

        #pdfInput { display: none; }
        canvas { outline: none; }
    </style>
</head>
<body class="bg-grid">

<div id="top-bar">
    <button class="btn" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
    <span id="pageDisplay">Page: 1 / 1</span>
    <button class="btn" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
    <button class="btn" onclick="addBlankPage()"><i class="fas fa-plus"></i></button>
</div>

<div id="toolbar">
    <button class="btn active" id="penBtn" onclick="setBrush('pen')"><i class="fas fa-pen"></i></button>
    <button class="btn" id="highBtn" onclick="setBrush('highlighter')"><i class="fas fa-marker"></i></button>
    <button class="btn" id="eraserBtn" onclick="setBrush('eraser')"><i class="fas fa-eraser"></i></button>
    
    <div style="width:1px; height:30px; background:#444;"></div>
    
    <input type="color" id="colorPicker" value="#ffffff" onchange="updateBrush()">
    
    <select id="bgPicker" onchange="changeBackground(this.value)" style="background:#333; color:white; border:none; padding:5px; border-radius:5px;">
        <option value="bg-grid">Grid</option>
        <option value="bg-dark">Dark</option>
        <option value="bg-white">White</option>
        <option value="bg-ruled">Ruled</option>
    </select>

    <div style="width:1px; height:30px; background:#444;"></div>

    <button class="btn" onclick="document.getElementById('pdfInput').click()"><i class="fas fa-file-upload"></i></button>
    <button class="btn" onclick="exportFullPDF()" style="background:#2e7d32;"><i class="fas fa-file-export"></i></button>
</div>

<input type="file" id="pdfInput" accept="application/pdf">
<canvas id="mainCanvas"></canvas>

<script>
    const { jsPDF } = window.jspdf;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let pages = [null]; // Stores JSON data of each page
    let currentPage = 0;

    const canvas = new fabric.Canvas('mainCanvas', {
        width: window.innerWidth,
        height: window.innerHeight,
        isDrawingMode: true
    });

    // --- Page Management ---
    function updatePageDisplay() {
        document.getElementById('pageDisplay').innerText = `Page: ${currentPage + 1} / ${pages.length}`;
    }

    function saveCurrentPageState() {
        pages[currentPage] = JSON.stringify(canvas);
    }

    function nextPage() {
        if (currentPage < pages.length - 1) {
            saveCurrentPageState();
            currentPage++;
            loadPage(currentPage);
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            saveCurrentPageState();
            currentPage--;
            loadPage(currentPage);
        }
    }

    function addBlankPage() {
        saveCurrentPageState();
        pages.push(null);
        currentPage = pages.length - 1;
        canvas.clear();
        updatePageDisplay();
    }

    function loadPage(index) {
        canvas.clear();
        if (pages[index]) {
            canvas.loadFromJSON(pages[index], () => {
                canvas.renderAll();
                updateBrush();
            });
        }
        updatePageDisplay();
    }

    // --- PDF Multi-Page Upload ---
    document.getElementById('pdfInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            
            // Loop through all pages in the PDF
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const tempCanvas = document.createElement('canvas');
                const context = tempCanvas.getContext('2d');
                tempCanvas.height = viewport.height;
                tempCanvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                // Add as a new page slide
                const imgData = tempCanvas.toDataURL();
                fabric.Image.fromURL(imgData, (img) => {
                    img.set({ selectable: false });
                    
                    if (i === 1 && pages[0] === null) {
                        // Put first page on current empty slide
                        canvas.add(img);
                        canvas.sendToBack(img);
                    } else {
                        // Create new slides for subsequent PDF pages
                        const newCanvas = new fabric.Canvas(null, { width: window.innerWidth, height: window.innerHeight });
                        newCanvas.add(img);
                        pages.push(JSON.stringify(newCanvas));
                    }
                    updatePageDisplay();
                });
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // --- Brushes & Backgrounds ---
    function setBrush(type) {
        canvas.isDrawingMode = true;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        const color = document.getElementById('colorPicker').value;

        if (type === 'pen') {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 5;
            canvas.freeDrawingBrush.color = color;
            document.getElementById('penBtn').classList.add('active');
        } else if (type === 'highlighter') {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 30;
            canvas.freeDrawingBrush.color = color + '50';
            document.getElementById('highBtn').classList.add('active');
        } else if (type === 'eraser') {
            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.width = 40;
            // Matches the current background color logic
            canvas.freeDrawingBrush.color = document.body.classList.contains('bg-white') ? '#ffffff' : '#121212';
            document.getElementById('eraserBtn').classList.add('active');
        }
    }

    function updateBrush() {
        const color = document.getElementById('colorPicker').value;
        if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = color;
    }

    function changeBackground(className) {
        document.body.className = className;
        // Adjust eraser color based on background
        if (document.getElementById('eraserBtn').classList.contains('active')) setBrush('eraser');
    }

    // --- Export Multi-Page PDF ---
    async function exportFullPDF() {
        saveCurrentPageState();
        const pdf = new jsPDF('l', 'px', [canvas.width, canvas.height]);
        
        for (let i = 0; i < pages.length; i++) {
            if (i > 0) pdf.addPage([canvas.width, canvas.height], 'l');
            
            // Temporary canvas to render each state for the PDF
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempFabric = new fabric.StaticCanvas(tempCanvas);
            
            await new Promise(resolve => {
                tempFabric.loadFromJSON(pages[i], () => {
                    const imgData = tempFabric.toDataURL({ format: 'png' });
                    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                    resolve();
                });
            });
        }
        pdf.save("class-notes.pdf");
    }

    // Initialize
    window.addEventListener('resize', () => canvas.setDimensions({ width: window.innerWidth, height: window.innerHeight }));
    setBrush('pen');
    updatePageDisplay();
</script>

</body>
</html>
